<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>pyttsx3 测试页面</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary-color: #2563eb;
            --secondary-color: #1e40af;
            --background-color: #f8fafc;
            --card-background: #ffffff;
            --text-primary: #0f172a;
            --text-secondary: #475569;
            --border-color: #e2e8f0;
            --header-gradient: linear-gradient(135deg, #2563eb 0%, #1e40af 100%);
            --main-gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        .dark-theme {
            --primary-color: #3b82f6;
            --secondary-color: #2563eb;
            --background-color: #0f172a;
            --card-background: #1e293b;
            --text-primary: #f8fafc;
            --text-secondary: #cbd5e1;
            --border-color: #334155;
            --header-gradient: linear-gradient(135deg, #1e40af 0%, #0f172a 100%);
            --main-gradient: linear-gradient(135deg, #1e3a8a 0%, #2c1050 100%);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: var(--main-gradient);
            min-height: 100vh;
            padding: 20px;
            color: var(--text-primary);
            transition: all 0.3s ease;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            background: var(--card-background);
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
            transition: all 0.3s ease;
        }

        .header {
            background: var(--header-gradient);
            color: white;
            padding: 30px;
            text-align: center;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header-content {
            flex: 1;
            text-align: center;
        }

        .header h1 {
            font-size: 2rem;
            margin-bottom: 10px;
        }

        .header p {
            opacity: 0.9;
            font-size: 1.1rem;
        }

        .content {
            padding: 40px;
        }

        .section {
            margin-bottom: 30px;
        }

        .section-title {
            font-size: 1.5rem;
            color: var(--primary-color);
            margin-bottom: 20px;
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 10px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: var(--text-primary);
        }

        input[type="text"], textarea, select {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 1rem;
            background: var(--card-background);
            color: var(--text-primary);
            transition: all 0.3s ease;
        }

        input[type="text"]:focus, textarea:focus, select:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }

        textarea {
            resize: vertical;
            min-height: 120px;
        }

        .controls {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .control-group {
            background: var(--background-color);
            padding: 20px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
        }

        .slider {
            width: 100%;
            margin: 10px 0;
        }

        .btn {
            padding: 12px 25px;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-right: 10px;
            margin-bottom: 10px;
        }

        .btn-primary {
            background: var(--primary-color);
            color: white;
        }

        .btn-primary:hover {
            background: var(--secondary-color);
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
        }

        .btn-secondary {
            background: var(--border-color);
            color: var(--text-primary);
        }

        .btn-secondary:hover {
            background: #cbd5e1;
        }

        .status {
            margin-top: 20px;
            padding: 15px;
            border-radius: 8px;
            font-weight: 600;
        }

        .status.success {
            background: #dcfce7;
            color: #15803d;
            border: 1px solid #bbf7d0;
        }

        .status.error {
            background: #fee2e2;
            color: #991b1b;
            border: 1px solid #fca5a5;
        }

        .status.info {
            background: #dbeafe;
            color: #1e40af;
            border: 1px solid #bfdbfe;
        }

        .voice-info {
            background: var(--background-color);
            padding: 20px;
            border-radius: 8px;
            margin-top: 20px;
            border: 1px solid var(--border-color);
        }

        .voice-info h4 {
            margin-bottom: 15px;
            color: var(--primary-color);
        }

        .voice-info ul {
            list-style: none;
        }

        .voice-info li {
            padding: 10px;
            border-bottom: 1px solid var(--border-color);
        }

        .voice-info li:last-child {
            border-bottom: none;
        }

        .voice-info .active {
            background: var(--header-gradient);
            color: white;
            border-radius: 4px;
            padding: 5px 10px;
            font-size: 0.8rem;
            display: inline-block;
            margin-left: 10px;
        }

        @media (max-width: 768px) {
            .header {
                padding: 20px;
            }
            
            .content {
                padding: 20px;
            }
            
            .controls {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
                <div class="header-content">
                    <h1><i class="fas fa-volume-up"></i> pyttsx3 测试页面</h1>
                    <p>在这里测试pyttsx3库的文本转语音功能</p>
                </div>
                <button class="theme-toggle" onclick="toggleTheme()" style="
                    padding: 10px 15px;
                    border: none;
                    border-radius: 8px;
                    background: rgba(255, 255, 255, 0.2);
                    color: white;
                    cursor: pointer;
                    transition: all 0.3s ease;
                ">
                    <i class="fas fa-moon"></i>
                </button>
            </div>
        
        <div class="content">
            <div class="section">
                <div class="section-title">文本输入</div>
                <div class="form-group">
                    <label for="textInput">输入要朗读的文本：</label>
                    <textarea id="textInput" placeholder="请输入要朗读的文本内容...">这是一个测试文本，用于演示pyttsx3的文本转语音功能。你可以输入自己的文本进行测试。</textarea>
                </div>
            </div>

            <div class="section">
                <div class="section-title">语音设置</div>
                
                <div class="form-group">
                    <label for="voiceSelect">选择语音：</label>
                    <select id="voiceSelect">
                        <option value="0">语音 1（默认）</option>
                        <option value="1">语音 2</option>
                    </select>
                </div>

                <div class="controls">
                    <div class="control-group">
                        <label for="rateSlider">语速：<span id="rateValue">200</span></label>
                        <input type="range" id="rateSlider" class="slider" min="50" max="500" value="200" step="10">
                    </div>
                    
                    <div class="control-group">
                        <label for="volumeSlider">音量：<span id="volumeValue">100</span>%</label>
                        <input type="range" id="volumeSlider" class="slider" min="0" max="100" value="100" step="5">
                    </div>
                </div>
            </div>

            <div class="section">
                <div class="section-title">操作按钮</div>
                <div>
                    <button class="btn btn-primary" onclick="speakText()">
                        <i class="fas fa-play"></i> 开始朗读
                    </button>
                    <button class="btn btn-secondary" onclick="stopSpeaking()">
                        <i class="fas fa-stop"></i> 停止朗读
                    </button>
                    <button class="btn btn-secondary" onclick="saveToFile()">
                        <i class="fas fa-save"></i> 保存到文件
                    </button>
                    <button class="btn btn-secondary" onclick="loadExampleText()">
                        <i class="fas fa-file"></i> 加载示例文本
                    </button>
                </div>
            </div>

            <div class="section">
                <div class="section-title">语音信息</div>
                <div class="voice-info">
                    <h4>系统中可用的语音：</h4>
                    <ul id="voiceList">
                        <li>语音 1 - 男性 - 英语</li>
                        <li>语音 2 - 女性 - 英语</li>
                    </ul>
                </div>
            </div>

            <div id="statusMessage" class="status info">
                <i class="fas fa-info-circle"></i> 准备就绪，请输入文本并点击开始朗读按钮
            </div>
        </div>
    </div>

    <script>
        // 初始化默认值
        let engine = null;
        let isSpeaking = false;
        
        // 初始化pyttsx3引擎
        function initEngine() {
            try {
                // 注意：这里只是模拟，实际使用时需要在Python环境中运行
                console.log('pyttsx3 引擎已初始化');
                updateStatus('pyttsx3 引擎已初始化', 'success');
                return true;
            } catch (error) {
                console.error('引擎初始化失败:', error);
                updateStatus('引擎初始化失败，请确保已安装pyttsx3库', 'error');
                return false;
            }
        }

        // 朗读文本
        function speakText() {
            const text = document.getElementById('textInput').value;
            if (!text.trim()) {
                updateStatus('请输入要朗读的文本', 'error');
                return;
            }

            const voiceIndex = document.getElementById('voiceSelect').value;
            const rate = document.getElementById('rateSlider').value;
            const volume = document.getElementById('volumeSlider').value / 100;

            console.log(`开始朗读：${text}`);
            console.log(`语音选择：${voiceIndex}, 语速：${rate}, 音量：${volume}`);
            
            isSpeaking = true;
            updateStatus(`正在朗读...`, 'success');

            // 模拟朗读过程
            setTimeout(() => {
                isSpeaking = false;
                updateStatus(`朗读完成`, 'info');
            }, 2000);
        }

        // 停止朗读
        function stopSpeaking() {
            if (isSpeaking) {
                console.log('停止朗读');
                isSpeaking = false;
                updateStatus(`已停止朗读`, 'info');
            }
        }

        // 保存到文件
        function saveToFile() {
            const text = document.getElementById('textInput').value;
            if (!text.trim()) {
                updateStatus('请输入要保存的文本', 'error');
                return;
            }

            console.log('保存到文件功能已触发');
            updateStatus(`正在保存到文件...`, 'success');
            
            // 模拟保存过程
            setTimeout(() => {
                updateStatus(`音频文件已保存成功`, 'success');
            }, 1500);
        }

        // 加载示例文本
        function loadExampleText() {
            const exampleText = `欢迎使用pyttsx3测试页面！

这是一个功能强大的Python离线文本转语音库。

主要特性包括：
- 完全离线工作
- 多种语音选择
- 灵活的语速和音量控制
- 支持保存为音频文件`;
            
            document.getElementById('textInput').value = exampleText;
            updateStatus(`已加载示例文本`, 'success');
        }

        // 更新状态消息
        function updateStatus(message, type = 'info') {
            const statusElement = document.getElementById('statusMessage');
            statusElement.className = `status ${type}`;
            statusElement.innerHTML = `<i class="fas fa-${type === 'success' ? 'check-circle' : type === 'error' ? 'exclamation-circle' : 'info-circle'}"></i> ${message}`;
        }

        // 更新语速和音量显示
        document.getElementById('rateSlider').addEventListener('input', function(e) {
            document.getElementById('rateValue').textContent = e.target.value;
        });

        document.getElementById('volumeSlider').addEventListener('input', function(e) {
            document.getElementById('volumeValue').textContent = e.target.value;
        });

        // 主题切换功能
        function toggleTheme() {
            document.body.classList.toggle('dark-theme');
            const themeIcon = document.querySelector('.theme-toggle i');
            
            if (document.body.classList.contains('dark-theme')) {
                themeIcon.classList.remove('fa-moon');
                themeIcon.classList.add('fa-sun');
            } else {
                themeIcon.classList.remove('fa-sun');
                themeIcon.classList.add('fa-moon');
            }
            
            // 保存主题偏好
            localStorage.setItem('pyttsx3-theme', document.body.classList.contains('dark-theme') ? 'dark' : 'light');
        }

        // 页面加载完成后初始化
        window.addEventListener('load', function() {
            // 恢复主题偏好
            const savedTheme = localStorage.getItem('pyttsx3-theme') || 'light';
            if (savedTheme === 'dark') {
                document.body.classList.add('dark-theme');
                const themeIcon = document.querySelector('.theme-toggle i');
                themeIcon.classList.remove('fa-moon');
                themeIcon.classList.add('fa-sun');
            }
            
            // 检查系统主题偏好
            if (!localStorage.getItem('pyttsx3-theme')) {
                const prefersDarkMode = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
                if (prefersDarkMode) {
                    document.body.classList.add('dark-theme');
                    const themeIcon = document.querySelector('.theme-toggle i');
                    themeIcon.classList.remove('fa-moon');
                    themeIcon.classList.add('fa-sun');
                }
            }
            
            initEngine();
            
            // 添加键盘快捷键
            document.addEventListener('keydown', function(e) {
                // Ctrl+Enter 开始朗读
                if (e.ctrlKey && e.key === 'Enter') {
                    speakText();
                }
                // Escape 停止朗读
                if (e.key === 'Escape') {
                    stopSpeaking();
                }
                // Ctrl+T 切换主题
                if (e.ctrlKey && e.key === 't') {
                    toggleTheme();
                }
            });
        });
    </script>
</body>
</html>
